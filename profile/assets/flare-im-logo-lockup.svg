<svg width="304" height="110" viewBox="0 0 304 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Flare IM logo</title>
  <desc id="desc">A dark Flare IM lockup with a slanted gradient F mark.</desc>
  <defs>
    <linearGradient id="flare-mark" x1="56" y1="30" x2="92" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEBFF"/>
      <stop offset="0.45" stop-color="#4098FF"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <filter id="mark-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#5EEBFF" flood-opacity="0.22"/>
    </filter>
    <style>
      .word { fill: #F7FAFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 29px; font-weight: 760; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="304" height="110" rx="0" fill="#07152D"/>
  <g filter="url(#mark-glow)">
    <path d="M66 32H99" stroke="url(#flare-mark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 32L56 78" stroke="url(#flare-mark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 54H88" stroke="url(#flare-mark)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="126" y="67" class="word">Flare IM</text>
</svg>
