<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Flare IM system map</title>
  <desc id="desc">A layered system map for Flare IM showing experience, SDK, Rust core, contracts, server services, and transport.</desc>
  <defs>
    <linearGradient id="surface" x1="56" y1="28" x2="1120" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17133A"/>
      <stop offset="0.48" stop-color="#102C40"/>
      <stop offset="1" stop-color="#14251F"/>
    </linearGradient>
    <linearGradient id="flare" x1="88" y1="44" x2="348" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D97BEF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#21C7B7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <style>
      .label { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
      .title { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 64px; font-weight: 800; letter-spacing: 0; }
      .subtitle { fill: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 500; }
      .small { fill: #D8DEE9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; }
      .micro { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; }
      .card { fill: rgba(255,255,255,0.075); stroke: rgba(255,255,255,0.18); stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="28" fill="url(#surface)"/>
  <rect x="24" y="24" width="1152" height="372" rx="22" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="80" y="72" width="152" height="152" rx="30" fill="url(#flare)"/>
    <rect x="112" y="104" width="32" height="32" fill="#F8D7FF"/>
    <rect x="168" y="104" width="32" height="32" fill="#F8D7FF"/>
    <rect x="112" y="144" width="88" height="34" fill="#F8D7FF"/>
    <rect x="130" y="188" width="52" height="14" fill="#F8D7FF"/>
  </g>

  <text x="272" y="112" class="title">Flare IM</text>
  <text x="276" y="150" class="subtitle">Realtime messaging infrastructure with a Rust core and native-feeling SDKs.</text>

  <g transform="translate(276 190)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#DEA584" fill-opacity="0.18" stroke="#DEA584" stroke-opacity="0.55"/>
    <text x="22" y="22" class="small" fill="#FFE5D0">Rust core</text>

    <rect x="136" y="0" width="138" height="34" rx="17" fill="#1F6FEB" fill-opacity="0.18" stroke="#58A6FF" stroke-opacity="0.58"/>
    <text x="158" y="22" class="small">7 platforms</text>

    <rect x="290" y="0" width="112" height="34" rx="17" fill="#21C7B7" fill-opacity="0.18" stroke="#21C7B7" stroke-opacity="0.58"/>
    <text x="312" y="22" class="small">UI Kit</text>

    <rect x="418" y="0" width="132" height="34" rx="17" fill="#2DA44E" fill-opacity="0.18" stroke="#2DA44E" stroke-opacity="0.58"/>
    <text x="440" y="22" class="small">Pre-release</text>
  </g>

  <g transform="translate(84 272)">
    <rect class="card" x="0" y="0" width="168" height="84" rx="16"/>
    <text x="22" y="36" class="label">Experience</text>
    <text x="22" y="62" class="micro">apps, routes, UI kit</text>
  </g>

  <path d="M262 314H310" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M303 307L311 314L303 321" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(320 272)">
    <rect class="card" x="0" y="0" width="168" height="84" rx="16"/>
    <text x="22" y="36" class="label">SDK Layer</text>
    <text x="22" y="62" class="micro">TS, Swift, Kotlin, Dart</text>
  </g>

  <path d="M498 314H546" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M539 307L547 314L539 321" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(556 272)">
    <rect class="card" x="0" y="0" width="168" height="84" rx="16"/>
    <text x="22" y="36" class="label">Rust Core</text>
    <text x="22" y="62" class="micro">send, sync, storage</text>
  </g>

  <path d="M734 314H782" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M775 307L783 314L775 321" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(792 272)">
    <rect class="card" x="0" y="0" width="168" height="84" rx="16"/>
    <text x="22" y="36" class="label">Contracts</text>
    <text x="22" y="62" class="micro">proto, bindings, spec</text>
  </g>

  <path d="M970 314H1018" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M1011 307L1019 314L1011 321" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1028 272)">
    <rect class="card" x="0" y="0" width="88" height="84" rx="16"/>
    <text x="18" y="36" class="small">Server</text>
    <text x="18" y="62" class="micro">fanout</text>
  </g>

  <circle cx="1052" cy="98" r="3" fill="#21C7B7"/>
  <circle cx="1074" cy="98" r="3" fill="#A78BFA"/>
  <circle cx="1096" cy="98" r="3" fill="#FBBF24"/>
  <text x="1010" y="132" class="micro">QUIC / WebSocket</text>
</svg>
