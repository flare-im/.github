<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Flare IM protocol weave</title>
  <desc id="desc">A distinctive system map for Flare IM showing the standalone slanted F logo mark and message packets moving through UI, SDK, Rust core, contracts, server fanout, and transport boundaries.</desc>
  <defs>
    <linearGradient id="paper" x1="70" y1="20" x2="1100" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.56" stop-color="#EEF6F6"/>
      <stop offset="1" stop-color="#F7F3EE"/>
    </linearGradient>
    <linearGradient id="brand-mark" x1="104" y1="96" x2="150" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEBFF"/>
      <stop offset="0.45" stop-color="#4098FF"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <linearGradient id="packet" x1="190" y1="306" x2="1016" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A5CFF"/>
      <stop offset="0.36" stop-color="#20D5C5"/>
      <stop offset="0.68" stop-color="#D08A5B"/>
      <stop offset="1" stop-color="#43C981"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#172033" flood-opacity="0.16"/>
    </filter>
    <style>
      .display { fill: #172033; font-family: "Avenir Next Condensed", "Arial Narrow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 72px; font-weight: 800; letter-spacing: 0; }
      .lead { fill: #2A3545; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 24px; font-weight: 650; }
      .caption { fill: #607083; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
      .node { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 21px; font-weight: 760; }
      .node-note { fill: #617285; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .fine { fill: #748397; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#paper)"/>

  <g opacity="0.7">
    <path d="M56 86H1144" stroke="#DDE5EE"/>
    <path d="M56 156H1144" stroke="#DDE5EE"/>
    <path d="M56 226H1144" stroke="#DDE5EE"/>
    <path d="M56 296H1144" stroke="#DDE5EE"/>
    <path d="M56 366H1144" stroke="#DDE5EE"/>
    <path d="M56 436H1144" stroke="#DDE5EE"/>
    <path d="M148 48V472" stroke="#E2E8F0"/>
    <path d="M328 48V472" stroke="#E2E8F0"/>
    <path d="M508 48V472" stroke="#E2E8F0"/>
    <path d="M688 48V472" stroke="#E2E8F0"/>
    <path d="M868 48V472" stroke="#E2E8F0"/>
    <path d="M1048 48V472" stroke="#E2E8F0"/>
  </g>

  <path d="M104 380C178 318 250 352 316 296C390 234 454 254 526 302C604 354 668 354 746 298C826 240 890 224 970 268C1038 306 1082 292 1120 254" stroke="#C8D2DE" stroke-width="16" stroke-linecap="round" opacity="0.44"/>
  <path d="M104 380C178 318 250 352 316 296C390 234 454 254 526 302C604 354 668 354 746 298C826 240 890 224 970 268C1038 306 1082 292 1120 254" stroke="url(#packet)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#soft-shadow)">
    <rect x="84" y="78" width="92" height="92" rx="18" fill="#07152D"/>
    <path d="M120 102H153" stroke="url(#brand-mark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 102L110 148" stroke="url(#brand-mark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M116 124H142" stroke="url(#brand-mark)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="220" y="122" class="display">Flare IM</text>
  <text x="224" y="166" class="lead">One Rust behavior core, projected into native SDKs.</text>
  <text x="224" y="202" class="caption">transport / contracts / server fanout / client engine / 7 platform SDKs / UI kit</text>

  <g transform="translate(224 236)">
    <rect x="0" y="0" width="184" height="36" rx="18" fill="#FFFFFF" stroke="#D2DAE5"/>
    <circle cx="22" cy="18" r="5" fill="#7A5CFF"/>
    <text x="38" y="23" class="caption">business-neutral</text>

    <rect x="204" y="0" width="144" height="36" rx="18" fill="#FFFFFF" stroke="#D2DAE5"/>
    <circle cx="226" cy="18" r="5" fill="#20D5C5"/>
    <text x="242" y="23" class="caption">typed contracts</text>

    <rect x="368" y="0" width="142" height="36" rx="18" fill="#FFFFFF" stroke="#D2DAE5"/>
    <circle cx="390" cy="18" r="5" fill="#D08A5B"/>
    <text x="406" y="23" class="caption">Rust engine</text>

    <rect x="530" y="0" width="146" height="36" rx="18" fill="#FFFFFF" stroke="#D2DAE5"/>
    <circle cx="552" cy="18" r="5" fill="#43C981"/>
    <text x="568" y="23" class="caption">sync recovery</text>
  </g>

  <g transform="translate(78 332)">
    <rect x="0" y="0" width="158" height="94" rx="22" fill="#FFFFFF" stroke="#CFD8E3"/>
    <path d="M32 35H58M32 51H76M32 67H66" stroke="#7A5CFF" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="42" class="node">UI</text>
    <text x="90" y="66" class="node-note">design</text>
  </g>

  <g transform="translate(282 300)">
    <rect x="0" y="0" width="168" height="104" rx="22" fill="#FFFFFF" stroke="#CFD8E3"/>
    <path d="M34 34L56 52L34 70" stroke="#20D5C5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 34L84 52L62 70" stroke="#20D5C5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="44" class="node">SDK</text>
    <text x="102" y="68" class="node-note">native</text>
  </g>

  <g transform="translate(512 330)">
    <rect x="0" y="0" width="172" height="96" rx="22" fill="#172033" stroke="#172033"/>
    <path d="M34 48C48 28 74 28 88 48C102 68 128 68 142 48" stroke="#D08A5B" stroke-width="5" stroke-linecap="round"/>
    <text x="32" y="40" class="node" fill="#FFFFFF">Rust Core</text>
    <text x="32" y="70" class="node-note" fill="#B7C1CE">send sync store</text>
  </g>

  <g transform="translate(732 290)">
    <rect x="0" y="0" width="176" height="108" rx="22" fill="#FFFFFF" stroke="#CFD8E3"/>
    <path d="M40 38H88M40 56H118M40 74H98" stroke="#7A5CFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 36V78" stroke="#D08A5B" stroke-width="4" stroke-linecap="round"/>
    <text x="32" y="96" class="node-note">proto / spec / bindings</text>
  </g>

  <g transform="translate(952 274)">
    <rect x="0" y="0" width="164" height="122" rx="24" fill="#FFFFFF" stroke="#CFD8E3"/>
    <circle cx="82" cy="54" r="30" fill="#E9F9F4" stroke="#43C981" stroke-width="4"/>
    <circle cx="82" cy="54" r="13" fill="#43C981"/>
    <path d="M82 17V2M45 54H30M134 54H119" stroke="#43C981" stroke-width="4" stroke-linecap="round"/>
    <text x="34" y="106" class="node">Fanout</text>
  </g>

  <g transform="translate(900 82)">
    <path d="M34 42C76 6 134 6 176 42" stroke="#C9D4E0" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 68C88 44 122 44 152 68" stroke="#C9D4E0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="92" r="9" fill="#20D5C5"/>
    <text x="0" y="124" class="caption">QUIC / WebSocket</text>
  </g>

  <g>
    <circle cx="180" cy="316" r="7" fill="#7A5CFF"/>
    <circle cx="352" cy="276" r="7" fill="#20D5C5"/>
    <circle cx="542" cy="314" r="7" fill="#D08A5B"/>
    <circle cx="746" cy="298" r="7" fill="#7A5CFF"/>
    <circle cx="970" cy="268" r="7" fill="#43C981"/>
  </g>

  <text x="78" y="472" class="fine">message path</text>
  <text x="280" y="472" class="fine">platform adaptation</text>
  <text x="512" y="472" class="fine">canonical behavior</text>
  <text x="732" y="472" class="fine">typed boundary</text>
  <text x="952" y="472" class="fine">delivery and presence</text>
</svg>
