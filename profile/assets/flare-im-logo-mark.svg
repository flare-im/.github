<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Flare IM logo mark</title>
  <desc id="desc">A slanted F mark with a cyan-to-violet gradient.</desc>
  <defs>
    <linearGradient id="flare-mark" x1="34" y1="24" x2="61" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEBFF"/>
      <stop offset="0.48" stop-color="#4098FF"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <filter id="mark-glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4098FF" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#mark-glow)">
    <path d="M38 24H68" stroke="url(#flare-mark)" stroke-width="9" stroke-linecap="round"/>
    <path d="M38 24L27 72" stroke="url(#flare-mark)" stroke-width="9" stroke-linecap="round"/>
    <path d="M34 47H58" stroke="url(#flare-mark)" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
